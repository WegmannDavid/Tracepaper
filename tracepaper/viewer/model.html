<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracepaper</title>
<link rel="stylesheet" href="/viewer/style.css">
<script type="importmap">
{ "imports": { "three": "/viewer/vendor/three/three.module.js", "three/addons/": "/viewer/vendor/three/addons/" } }
</script>
</head>
<body>
<header class="tpv-bar" id="tpv-bar">
  <a class="tpv-home" href="/" title="All views in this project" aria-label="All views"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7.5 8 2.5l5.5 5M4 6.5v7h3v-4h2v4h3v-7"/></svg></a>
  <select id="tpv-view" aria-label="View"></select>
  <div class="tpv-group" role="group" aria-label="Look from">
    <button data-look="iso" title="Isometric (0)">Iso</button>
    <button data-look="top" title="From above (7)">Top</button>
    <button data-look="front" title="From the front (1)">Front</button>
    <button data-look="right" title="From the right (3)">Right</button>
  </div>
  <div class="tpv-group">
    <button id="tpv-fit" title="Fit the model, keeping the direction (F)">Fit</button>
    <button id="tpv-edges" aria-pressed="true" title="Show the edges (E)">Edges</button>
    <button id="tpv-transparent" aria-pressed="false" title="See through every face (T)">Transparent</button>
    <button id="tpv-perspective" aria-pressed="false">Perspective</button>
  </div>
  <div class="tpv-group">
    <button id="tpv-sketch" aria-pressed="false"
            title="Sketch over the view (P). While there is ink the view can't turn, only pan and zoom.">Sketch</button>
    <button id="tpv-erase" aria-pressed="false" title="Erase whole strokes with the mouse (X)">Erase</button>
  </div>
  <div class="tpv-group" id="tpv-swatches" role="group" aria-label="Ink colour"></div>
  <div class="tpv-group">
    <button id="tpv-undo" class="tpv-icon" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.2 5.2A5 5 0 1 1 3 9"/><path d="M3.6 1.8v3.8h3.8"/></svg></button>
    <button id="tpv-clear" title="Remove all ink">Clear</button>
  </div>
  <div class="tpv-end">
    <button id="tpv-pen-button" hidden>Connect reMarkable</button>
    <span id="tpv-status" class="tpv-status" role="status"></span>
  </div>
  <button id="tpv-save" class="tpv-primary" title="Save the sketch file (Ctrl+S)">Save</button>
</header>
<main>
  <div class="tpv-stage-wrap">
    <canvas id="tpv-canvas"></canvas>
    <!-- The ink, in mm on the plane the camera looks at (y up), and where the tablet's pen is. -->
    <svg id="tpv-ink" class="tpv-overlay" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <g id="tp-sketch" transform="scale(1,-1)"></g>
    </svg>
    <svg class="tpv-overlay" xmlns="http://www.w3.org/2000/svg"><circle id="tpv-pen-cursor" r="4" visibility="hidden"/></svg>
    <div id="tpv-empty" class="tpv-empty">Loading…</div>
    <svg id="tpv-axes" class="tpv-axes" viewBox="-45 -45 90 90" aria-label="Axes"></svg>
    <div class="tpv-coords" id="tpv-hint">Drag to rotate · right-drag to pan · scroll to zoom</div>
    <div id="tpv-toast" class="tpv-toast" role="status" hidden></div>
  </div>
  <aside class="tpv-panel">
    <h2>Tree</h2>
    <ul id="tpv-layers"></ul>
    <h2 class="tpv-section">Slice</h2>
    <div id="tpv-slices"></div>
    <h2 class="tpv-section" id="tpv-motion-head" hidden>Sliders</h2>
    <div id="tpv-motion" class="tpv-frames"></div>
    <h2 class="tpv-section" id="tpv-frames-head" hidden>Frames</h2>
    <div id="tpv-frames" class="tpv-frames"></div>
  </aside>
</main>
<script type="module" src="/viewer/model.js"></script>
</body>
</html>
